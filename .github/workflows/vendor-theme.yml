name: Copy theme files

# Run by hand from the Actions tab. Copies the Carmel Valley Ranch stylesheet
# (and optionally fonts and photos) into this repository. See README.
on:
  workflow_dispatch:
    inputs:
      fonts:
        description: "Also copy the web fonts (only if CVR's font license allows it)"
        type: boolean
        default: false
      images:
        description: "Also copy the page photos into uploads/site/"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copy files
        run: |
          ARGS=""
          if [ "${{ inputs.fonts }}" = "true" ]; then ARGS="$ARGS --fonts"; fi
          if [ "${{ inputs.images }}" = "true" ]; then ARGS="$ARGS --images"; fi
          node scripts/vendor-theme.mjs $ARGS
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Copy Carmel Valley Ranch theme files into the repo"
          git push
